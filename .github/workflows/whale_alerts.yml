name: Whale Alerts (en vivo)

on:
  schedule:
    - cron: '0 */6 * * *'   # arranca una tanda nueva cada 6 horas
  workflow_dispatch:         # para probarlo a mano

permissions:
  contents: write

concurrency:
  group: whale-alerts
  cancel-in-progress: true   # una corrida nueva mata a la vieja al instante, nunca hace cola

jobs:
  watch-whales:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # un poco menos que 6h, para que corte antes que GitHub
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Vigilar en vivo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_DIAS_RESOLUCION: "1"
          PRECIO_MAX: "90"
          WHALE_THRESHOLD: "10000"
          PUBLICAR_RESULTADOS: "1"
        run: python -u whale_alert_bot.py
